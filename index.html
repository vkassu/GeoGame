<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoGame — викторина по географии</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="home-btn" class="home-btn" hidden>← На главную</button>
    <h1>GeoGame</h1>
  </header>
  <div id="status">Загрузка данных с restcountries.com…</div>

  <main id="game">
    <section id="start-screen" class="screen active">
      <h2 id="start-title">Угадай страну по флагу</h2>
      <p class="subtitle" id="start-subtitle">По флагу определи, что это за страна.</p>
      <p class="record">Рекорд: <span id="best-score">0</span></p>

      <h3 class="group-title" id="mode-title">Выбор режима</h3>
      <div class="mode" role="radiogroup" aria-labelledby="mode-title">
        <label class="mode-option">
          <input type="radio" name="mode" value="country" checked>
          <span class="mode-name">Страна</span>
          <small>по флагу</small>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="capital">
          <span class="mode-name">Столица</span>
          <small>по флагу</small>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="countryByCapital">
          <span class="mode-name">Страна</span>
          <small>по столице</small>
        </label>
      </div>

      <h3 class="group-title" id="difficulty-title">Выбор сложности</h3>
      <div class="difficulty" role="radiogroup" aria-labelledby="difficulty-title">
        <label class="diff-option">
          <input type="radio" name="difficulty" value="easy">
          <span class="diff-name">Лёгкая</span>
          <small>5 вопросов</small>
        </label>
        <label class="diff-option">
          <input type="radio" name="difficulty" value="medium" checked>
          <span class="diff-name">Средняя</span>
          <small>10 вопросов</small>
        </label>
        <label class="diff-option">
          <input type="radio" name="difficulty" value="hard">
          <span class="diff-name">Сложная</span>
          <small>15 вопросов</small>
        </label>
      </div>

      <button id="start-btn" class="primary-btn" disabled>Загрузка…</button>
    </section>

    <section id="game-screen" class="screen">
      <div class="meta">
        <span id="q-timer" class="q-timer">⏱ 30</span>
        <span id="q-counter">Вопрос 1 из 10</span>
        <span id="q-score">Счёт: 0</span>
      </div>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="flag-big" id="flag-big"></div>
      <h2 class="question-text">Какая столица этой страны?</h2>
      <div class="options" id="options"></div>
      <div id="answer-result" class="answer-result" hidden>
        <div id="answer-banner" class="answer-banner"></div>
        <div class="answer-body">
          <div id="answer-xp" class="answer-xp"></div>
          <div id="answer-picked" class="answer-picked"></div>
          <div id="answer-correct-val" class="answer-correct-val"></div>
          <div class="answer-hint">Нажмите для продолжения</div>
        </div>
      </div>
    </section>

    <section id="result-screen" class="screen">
      <h2>Игра окончена</h2>
      <p class="result-text" id="result-text"></p>
      <p class="games-played">Партий сыграно: <span id="games-played">0</span></p>
      <button id="play-again-btn" class="primary-btn">Играть снова</button>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
